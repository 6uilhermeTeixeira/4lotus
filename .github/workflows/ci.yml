name: strategy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run python scripts/build_bundle.py --output dist/4lotus-strategies.zip
      - uses: actions/upload-artifact@v4
        with:
          name: 4lotus-strategies
          path: dist/4lotus-strategies.zip
