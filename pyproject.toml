[project]
name = "4lotus-strategy"
version = "0.1.0"
description = "Unified Lotus strategy catalog, validation service and bundle producer."
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2.0",
  "fastapi>=0.115,<0.140",
  "uvicorn>=0.30,<1.0",
]

[dependency-groups]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
